name: Daily Job Ingestion & AI Tagging Refresh

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai python-dotenv pydantic pandas beautifulsoup4 lxml

      - name: Run Job Ingestion, Deduplication & AI Tagging Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_pipeline.py

      - name: Commit and Push Updated Jobs & Metrics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Daily Refresh]"
          git add data/ frontend/public/data/ frontend/src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-refresh: Updated 200+ fresher jobs and AI tags [skip ci]" && git push)
